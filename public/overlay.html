<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Screenwall – Overlays</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/overlay.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <a class="brand" href="/">Screenwall</a>
      <nav class="topnav" id="topnav"></nav>
    </div>
    <div class="topbar-actions">
      <span id="draftbar"></span>
    </div>
  </header>

  <!-- Drei Bereiche: links die Listen (was gibt es?), Mitte die Bühne (wie
       sieht es aus?), rechts der Inspektor (Eigenschaften des Gewählten).
       Der Inspektor ist kontextabhängig: ohne Auswahl zeigt er die
       Overlay-Einstellungen – deshalb gibt es dafür keine eigene Box mehr. -->
  <main class="ed-layout">
    <aside class="ed-side">
      <!-- Overlay-Liste -->
      <div class="ed-box ed-box-ovs">
        <div class="ed-box-head">
          <h3>Overlays</h3>
          <button id="ov-add" class="btn tiny">+ Overlay</button>
        </div>
        <div id="ov-list" class="ed-list ed-scroll"></div>
      </div>

      <!-- Elemente des gewählten Overlays -->
      <div class="ed-box ed-box-els" id="el-box" hidden>
        <div class="ed-box-head"><h3>Elemente</h3></div>
        <div class="ed-addrow">
          <button class="btn tiny" data-add-el="text">+ Text</button>
          <button class="btn tiny" data-add-el="rect">+ Rechteck</button>
          <button class="btn tiny" data-add-el="circle">+ Kreis</button>
          <button class="btn tiny" data-add-el="image">+ Bild</button>
          <button class="btn tiny" data-add-el="qr">+ QR-Code</button>
        </div>
        <div id="el-list" class="ed-list ed-scroll"></div>
      </div>

      <!-- Wiederverwertbare Bibliothek (reine Liste; Speichern liegt im
           ⋯-Menü des Inspektors, also dort, wo die Auswahl ist) -->
      <div class="ed-box ed-box-lib" id="lib-box">
        <div class="ed-box-head"><h3>Bibliothek</h3></div>
        <div id="lib-list" class="ed-list ed-scroll"></div>
      </div>
    </aside>

    <section class="ed-main">
      <div class="ed-stagewrap">
        <div id="ov-stage" class="ov-stage">
          <div id="ov-canvas" class="ov-canvas"></div>
        </div>
      </div>
      <div class="ed-canvasbar">
        <div class="ed-row" id="ov-bg-switch"></div>
        <span class="ed-keyhint">Entf löschen · Pfeile bewegen · ⇧+Pfeil grob ·
          Strg+D duplizieren · Esc Auswahl aufheben</span>
      </div>
    </section>

    <!-- Immer montiert: würde der Inspektor bei leerer Auswahl verschwinden,
         änderte die mittlere Spalte bei jedem Klick ihre Breite. -->
    <aside class="ed-insp" id="ed-insp">
      <div class="ed-insp-head" id="insp-head"></div>
      <div class="ed-insp-body ed-scroll" id="insp-body"></div>
    </aside>
  </main>

  <!-- versteckter Datei-Input für Bild-Upload eines Elements -->
  <input type="file" id="el-image-input" accept="image/*" hidden />

  <script src="/js/ui.js"></script>
  <script src="/js/overlay.js"></script>
</body>
</html>
