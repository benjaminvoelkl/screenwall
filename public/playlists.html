<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Screenwall – Playlists</title>
  <!-- Cropper.js für den optionalen 18:16-Zuschnitt (CDN; fehlt es, wird das
       Original hochgeladen – siehe cropThenUpload in playlists.js). -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/control.css" />
</head>
<body>
  <!-- Kopfzeile wie auf allen Steuer-Seiten: Marke, eine Hauptnavigation und die
       Entwurfs-Leiste, die auf unveröffentlichte Änderungen hinweist. -->
  <header class="topbar">
    <div class="topbar-title">
      <a class="brand" href="/">Screenwall</a>
      <nav class="topnav" id="topnav"></nav>
    </div>
    <div class="topbar-actions">
      <span id="draftbar"></span>
    </div>
  </header>

  <main class="pl-main">
    <!-- Übersicht: alle Playlists als Karten mit Storyboard -->
    <section id="pl-overview" class="pl-overview">
      <div class="pl-overview-head">
        <h2>Playlists</h2>
        <button id="pl-new" class="btn">+ Neue Playlist</button>
      </div>
      <div id="pl-cards" class="pl-cards"></div>
    </section>

    <!-- Detail / Bearbeiten einer einzelnen Playlist -->
    <section id="pl-detail" class="pl-detail" hidden>
      <!-- Über der Karte bleibt nur, was nicht die Playlist selbst ist:
           der Rückweg und die Aktionen auf die ganze Playlist. -->
      <div class="pl-detail-head">
        <a class="back-link" href="/playlists" title="Zur Übersicht">← Übersicht</a>
        <span class="pl-detail-actions" id="pl-detail-actions"></span>
      </div>
      <section class="pl-panel">
        <!-- Der Name ist die Überschrift der Karte; rechts oben der einzige
             Einstieg zum Hinzufügen. Umbenannt wird direkt im Titel.
             Welche Typen es gibt, steht als Tooltip am Knopf – die Auswahl
             zeigt es ohnehin gleich als Kacheln (content.js / CT.TYPES). -->
        <div class="pl-panel-head">
          <input type="text" id="pl-name" class="pl-name-edit" aria-label="Name der Playlist" />
          <span id="pl-root-badge" class="badge start hidden">★ Start</span>
          <button id="pl-add" class="btn"
            title="Bild, Video, YouTube, Webseite, Bildschirm, externer Stream, Farbe oder eine andere Playlist.">+ Inhalt hinzufügen</button>
        </div>

        <ul id="pl-items" class="media-list"></ul>
        <p class="hint">Reihenfolge per Ziehen ändern. 🗑 entfernt einen Eintrag.
          Ein einzelner Inhalt läuft immer über eine Playlist.</p>
      </section>

      <!-- Steht bewusst UNTER den Inhalten: selten gebraucht, und beim Anlegen
           fragt nichts mehr danach. Eingeklappt (siehe UI.section). -->
      <div id="pl-more"></div>
    </section>
  </main>

  <footer class="footer">
    <span class="status">
      <span id="conn-dot" class="dot"></span>
      <span id="conn-text">verbinde…</span>
    </span>
    <span class="vol" title="Lautstärke der Wand (System)">
      <label class="vol-label" for="vol-range">Wand-Lautstärke</label>
      <button id="vol-mute" class="vol-icon" title="Stummschalten" aria-label="Stummschalten">🔊</button>
      <input type="range" id="vol-range" min="0" max="100" step="1" value="50" />
      <span id="vol-val" class="vol-val">–</span>
    </span>
    <a class="screen-link" href="/screen" target="_blank">/screen öffnen ↗</a>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/content.js"></script>
  <script src="/js/playlists.js"></script>
</body>
</html>
