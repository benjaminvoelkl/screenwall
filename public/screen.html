<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <!-- App-Icon / Web-App (erzeugt mit tools/make-icons.py) -->
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Screenwall" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Screenwall – Anzeige</title>
  <link rel="stylesheet" href="/css/screen.css" />
</head>
<body>
  <!-- Verbindungs-Overlay (wird bei WS-Abbruch eingeblendet) -->
  <div id="offline" class="offline hidden">Verbindung verloren – verbinde neu…</div>

  <!-- Inhalts-Bühne: zwei Crossfade-Slots (color/image/video/webpage/screenshare)
       plus eine persistente YouTube-Schicht (eigener IFrame-Player). -->
  <div id="stage" class="stage">
    <div class="layer slot" id="slot-0"></div>
    <div class="layer slot" id="slot-1"></div>
    <div class="layer yt-layer" id="yt-layer"><div id="yt-player"></div></div>
  </div>

  <!-- Overlays: mehrere Layer ÜBER dem Content; Elemente frei positioniert. -->
  <div id="overlays" class="overlays"></div>

  <script src="/js/screen.js"></script>
</body>
</html>
